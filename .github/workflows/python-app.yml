# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Build and test CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install grapviz dev
      run: sudo apt-get update && sudo apt-get install -y libgraphviz-dev
    - name: Install python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    # the runner image already has Google Chrome and Node.js
    - name: Install chrome-har-capturer
      run: sudo npm install --global chrome-har-capturer
    - name: Run tests
      run: |
        cd src
        python -m pytest -q ../tests
    # shows the hops, and that tracing works without root (as the runner user)
    - name: Trace without root
      run: |
        cd src
        python parallelltracert.py
    - name: Prepare pyasn with fresh data
      run: |
        cd src
        ./updatepyasnfiles.sh
    - name: Test simple pages
      run: |
        cd src
        python generatemap.py -w www.dn.se www.svd.se -o newssites
    - name: Upload graph image
      uses: actions/upload-artifact@v4
      with:
        name: Upload graph
        path: src/newssites/
